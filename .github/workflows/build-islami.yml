name: Build Islami Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Islami APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking Islami Android project"
          echo "======================================"

          if [ -f settings.gradle.kts ]; then
            echo "OK: settings.gradle.kts"
          elif [ -f settings.gradle ]; then
            echo "OK: settings.gradle"
          else
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          if [ -f build.gradle.kts ]; then
            echo "OK: build.gradle.kts"
          elif [ -f build.gradle ]; then
            echo "OK: build.gradle"
          else
            echo "ERROR: build.gradle(.kts) not found"
            exit 1
          fi

          if [ -f app/build.gradle.kts ]; then
            echo "OK: app/build.gradle.kts"
          elif [ -f app/build.gradle ]; then
            echo "OK: app/build.gradle"
          else
            echo "ERROR: app/build.gradle(.kts) not found"
            exit 1
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "OK: AndroidManifest.xml"
          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          echo ""
          echo "Android project structure: PASS"

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          echo "======================================"
          echo "Java version"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "Gradle version"
          echo "======================================"
          gradle --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Cleaning project"
          echo "======================================"

          gradle clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Building Islami Debug APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

      - name: Show APK files
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "Searching for APK"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" release/Islami-debug.apk

          echo ""
          echo "APK ready:"
          ls -lh release/Islami-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Islami-APK
          path: release/Islami-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Islami-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
