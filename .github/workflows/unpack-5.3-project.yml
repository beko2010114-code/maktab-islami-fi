name: Unpack Islami Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Extract Islami Android project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync findutils

      - name: Locate Islami ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f \
            -iname 'Islami_Final_NoData_v10.zip' \
            ! -path './.git/*' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Islami_Final_NoData_v10.zip not found."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP"

      - name: Extract Islami ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/islami-extract"
          mkdir -p "$RUNNER_TEMP/islami-extract"

          unzip -q "${{ steps.zip.outputs.zip }}" \
            -d "$RUNNER_TEMP/islami-extract"

          echo "Extracted files:"
          find "$RUNNER_TEMP/islami-extract" -type f | sort | head -300

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/islami-extract" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Replace repository root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT/" ./

          echo "Repository after extraction:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' | sort | head -400

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts: PASS"
          elif [ -f settings.gradle ]; then
            echo "settings.gradle: PASS"
          else
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts: PASS"
          elif [ -f app/build.gradle ]; then
            echo "app/build.gradle: PASS"
          else
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "AndroidManifest.xml: PASS"
          else
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle wrapper: FOUND"
            ./gradlew --version | head -20
          else
            echo "WARNING: gradlew not found."
            echo "The project was extracted, but Gradle Wrapper must be added before building."
          fi

      - name: Remove source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${{ steps.zip.outputs.zip }}"

          echo "Source ZIP removed."

      - name: Commit Islami project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Islami Android project"

          git push origin HEAD:main
