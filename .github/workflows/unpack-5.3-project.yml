name: Build Islami APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Islami Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project structure
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' | sort

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure: PASS"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp "${{ steps.apk.outputs.path }}" \
            "release/Islami-debug.apk"

          ls -lh release/Islami-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islami-APK
          path: release/Islami-debug.apk
          if-no-files-found: error
          retention-days: 30
