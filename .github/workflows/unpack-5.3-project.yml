name: Unpack Maktab Islami 5.3 Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Extract Android project into repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync findutils

      - name: Locate ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -path './.git/*' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/maktab-extract"
          mkdir -p "$RUNNER_TEMP/maktab-extract"

          unzip -q "${{ steps.zip.outputs.zip }}" \
            -d "$RUNNER_TEMP/maktab-extract"

          echo "Extracted files:"
          find "$RUNNER_TEMP/maktab-extract" -type f | sort | head -300

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/maktab-extract" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Complete Android/Gradle project not found in ZIP."
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Replace repository root with project files
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT/" ./

          echo "Repository root after extraction:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' | sort | head -400

      - name: Validate Android Gradle structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || \
          test -f settings.gradle.kts

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f gradlew || {
            echo "ERROR: gradlew not found."
            exit 1
          }

          chmod +x gradlew

          echo "Android/Gradle structure: PASS"

          echo "Gradle wrapper:"
          ./gradlew --version | head -20

      - name: Remove source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${{ steps.zip.outputs.zip }}"

          echo "Source ZIP removed successfully."

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Maktab Islami 5.3 Android project"

          git push origin HEAD:main
